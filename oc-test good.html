<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{background:#080502;overflow:hidden;}

/* ── 全螢幕覆蓋 ── */
#oc{
  position:fixed;inset:0;
  background:#080502;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  opacity:0;
  transition:opacity 0.8s ease;
}
#oc.in{opacity:1;}
#oc.out{opacity:0;pointer-events:none;}

/* ── 膠卷橫條層 ── */
#strips{
  position:absolute;inset:0;
  display:flex;
  flex-direction:column;
  justify-content:space-around;
  gap:3px;
  overflow:hidden;
  pointer-events:none;
}

/* 每條橫向膠卷 */
.strip{
  display:flex;
  flex-direction:row;
  align-items:stretch;
  flex-shrink:0;
  height:96px;
}
@keyframes go-r{from{transform:translateX(0);}to{transform:translateX(-50%);}}
@keyframes go-l{from{transform:translateX(-50%);}to{transform:translateX(0);}}

/* 單格 */
.fr{
  flex-shrink:0;
  width:180px;
  height:100%;
  display:flex;
  flex-direction:column;
  border-right:1px solid rgba(0,0,0,0.5);
}

/* 打孔列 */
.pr{
  height:12px;
  flex-shrink:0;
  background:#1E1005;
  display:flex;
  align-items:center;
  padding:0 3px;
  gap:4px;
  overflow:hidden;
}
.h{
  display:inline-block;
  width:7px;height:4px;
  background:#0E0802;
  border:1px solid #1A1006;
  border-radius:1px;
  flex-shrink:0;
}

/* 16:9 圖片格 */
.fw{
  flex:1;
  overflow:hidden;
  position:relative;
  background:linear-gradient(to right,#1A0E04 0%,#2C1A08 50%,#1A0E04 100%);
}
.fw img{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  display:block;
  filter:brightness(0.82);
}

/* ── 遮罩：前3秒完全透明，第3秒與文字同步加深 ── */
#vig{
  position:absolute;inset:0;
  z-index:1;
  pointer-events:none;
  opacity:0;
  background:
    radial-gradient(ellipse 52% 44% at 50% 50%,
      rgba(8,5,2,0.85) 0%,
      rgba(8,5,2,0.45) 48%,
      rgba(8,5,2,0.00) 100%),
    linear-gradient(to bottom,
      rgba(0,0,0,0.5) 0%,transparent 15%,
      transparent 85%,rgba(0,0,0,0.5) 100%);
  transition:opacity 1.2s ease 1s;
}
#oc.in #vig{opacity:1;}

/* ── 文字：第1秒後淡入 ── */
#content{
  position:relative;
  z-index:2;
  text-align:center;
  padding:2rem;
}
#ci{
  opacity:0;
  transform:translateY(12px);
  transition:opacity 1.2s ease 1s,transform 1.2s ease 1s;
}
#oc.in #ci{opacity:1;transform:translateY(0);}

.etag{
  font-size:0.58rem;letter-spacing:0.32em;text-transform:uppercase;
  color:rgba(201,160,70,0.55);margin-bottom:0.9rem;
  font-family:'Courier New',monospace;
}
h1.t{
  font-family:'Playfair Display',serif;
  font-size:clamp(2.2rem,5.5vw,4.5rem);
  color:#F0E4CC;font-weight:700;line-height:1.18;
  text-shadow:0 2px 32px rgba(0,0,0,0.98);
  margin-bottom:0.5rem;
}
h1.t em{color:#C9A046;font-style:italic;}
.sub{
  font-size:clamp(0.78rem,1.5vw,1rem);
  color:rgba(240,228,204,0.5);letter-spacing:0.08em;
  text-shadow:0 1px 8px rgba(0,0,0,0.9);
  margin-bottom:2.4rem;
}
.btn{
  background:rgba(40,24,8,0.85);
  border:1px solid rgba(201,160,70,0.5);
  color:#C9A046;padding:0.9rem 3rem;
  font-size:0.82rem;letter-spacing:0.2em;text-transform:uppercase;
  cursor:pointer;font-family:'Noto Sans TC',sans-serif;
  border-radius:2px;transition:all 0.3s;
}
.btn:hover{border-color:rgba(201,160,70,0.85);color:#F0E4CC;}
.hint{
  margin-top:1rem;font-size:0.55rem;letter-spacing:0.2em;
  color:rgba(240,228,204,0.22);font-family:'Courier New',monospace;
  animation:blink 3s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:0.22;}50%{opacity:0.5;}}

/* 倒數條 */
#bar{
  position:absolute;bottom:0;left:0;
  height:2px;z-index:3;background:#C9A046;width:0;
}
</style>
